version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: healthform_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - healthform_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthform_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=healthform_ai
      - DEMO_MODE=true
      - SECRET_KEY=healthform-ai-research-secret-token-key-2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
      - ./sample_reports:/sample_reports:ro
      - ./knowledge_base:/knowledge_base:ro
    networks:
      - healthform_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthform_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - healthform_net

volumes:
  mongo_data:

networks:
  healthform_net:
    driver: bridge
